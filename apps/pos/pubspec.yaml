name: sarisupply_pos
description: SariSupply offline-first point-of-sale application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  mobile_scanner: 7.4.2
  uuid: ^4.6.0
  sqflite: ^2.4.4
  sarisupply_inventory:
    path: ../../packages/sarisupply_inventory
  sarisupply_auth:
    path: ../../packages/sarisupply_auth
  sarisupply_core:
    path: ../../packages/sarisupply_core
  sarisupply_design_system:
    path: ../../packages/sarisupply_design_system
  sarisupply_firebase:
    path: ../../packages/sarisupply_firebase
  sarisupply_models:
    path: ../../packages/sarisupply_models

dev_dependencies:
  sqflite_common_ffi: ^2.4.3
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
