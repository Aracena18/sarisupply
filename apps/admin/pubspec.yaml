name: sarisupply_admin
description: SariSupply admin and operations Flutter Web application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  flutter_riverpod: ^2.6.1
  sarisupply_auth:
    path: ../../packages/sarisupply_auth
  sarisupply_core:
    path: ../../packages/sarisupply_core
  sarisupply_design_system:
    path: ../../packages/sarisupply_design_system
  sarisupply_firebase:
    path: ../../packages/sarisupply_firebase
  sarisupply_inventory:
    path: ../../packages/sarisupply_inventory
  sarisupply_models:
    path: ../../packages/sarisupply_models
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
