name: sarisupply_design_system
description: Shared Flutter design system for SariSupply applications.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/storefront.png
    - assets/fonts/OFL.txt
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-400.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-700.ttf
          weight: 700
