name: sarisupply

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  format:
    run: dart run melos exec --fail-fast -- "dart format --output=none --set-exit-if-changed lib test"

  analyze:
    run: dart run melos exec --fail-fast -- "flutter analyze"

  test:
    run: dart run melos exec --fail-fast --concurrency=1 --dir-exists=test -- "flutter test"

  verify:
    run: dart run melos run format && dart run melos run analyze && dart run melos run test
